<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>工厂 ERP 管理系统</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="login-screen" id="loginScreen" hidden>
      <form class="login-card" id="loginForm">
        <div class="brand login-brand">
          <div class="brand-mark">ERP</div>
          <div>
            <strong>印刷包装 ERP</strong>
            <span>登录后进入业务系统</span>
          </div>
        </div>
        <label>
          <span>账号</span>
          <input name="username" value="admin" autocomplete="username" required />
        </label>
        <label>
          <span>密码</span>
          <input name="password" type="password" value="admin123" autocomplete="current-password" required />
        </label>
        <button class="primary-btn" type="submit">登录系统</button>
        <p>演示账号：admin / admin123，销售账号：sales / sales123</p>
      </form>
    </section>

    <div class="app-shell" id="appShell" hidden>
      <aside class="sidebar" aria-label="主菜单">
        <div class="brand">
          <div class="brand-mark">ERP</div>
          <div>
            <strong>印刷包装 ERP</strong>
            <span>销售 · 采购 · 生产 · 财务</span>
          </div>
        </div>

        <nav class="nav-list" id="navList">
          <button class="nav-item active" data-view="dashboard" type="button">
            <span class="nav-icon">⌂</span><span>经营首页</span>
          </button>
          <button class="nav-item" data-view="sales" type="button">
            <span class="nav-icon">￥</span><span>销售订单</span>
          </button>
          <button class="nav-item" data-view="crm" type="button">
            <span class="nav-icon">人</span><span>客户 CRM</span>
          </button>
          <button class="nav-item" data-view="products" type="button">
            <span class="nav-icon">品</span><span>产品与 BOM</span>
          </button>
          <button class="nav-item" data-view="inventory" type="button">
            <span class="nav-icon">库</span><span>库存管理</span>
          </button>
          <button class="nav-item" data-view="production" type="button">
            <span class="nav-icon">工</span><span>生产排程</span>
          </button>
          <button class="nav-item" data-view="quality" type="button">
            <span class="nav-icon">检</span><span>质量管理</span>
          </button>
          <button class="nav-item" data-view="finance" type="button">
            <span class="nav-icon">账</span><span>财务利润</span>
          </button>
          <button class="nav-item" data-view="hr" type="button">
            <span class="nav-icon">岗</span><span>人事权限</span>
          </button>
        </nav>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <button class="menu-toggle" id="menuToggle" type="button" aria-label="打开菜单">☰</button>
          <div>
            <p class="eyebrow">实时经营看板</p>
            <h1 id="pageTitle">经营首页</h1>
          </div>
          <div class="topbar-actions">
            <label class="search">
              <span>搜索</span>
              <input id="globalSearch" type="search" placeholder="客户、订单、产品、物料" />
            </label>
            <div class="user-pill">
              <strong id="userName">用户</strong>
              <span id="userRole">角色</span>
            </div>
            <button class="ghost-btn" type="button">导出</button>
            <button class="primary-btn" id="quickAction" type="button">新增订单</button>
            <button class="ghost-btn" id="logoutBtn" type="button">退出</button>
          </div>
        </header>

        <section class="content" id="content" aria-live="polite"></section>
      </main>
    </div>

    <div class="toast" id="toast" role="status">已更新</div>
    <script src="app.js"></script>
  </body>
</html>
